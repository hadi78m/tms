<script>
/* ════════════════════ ابزارهای پایه ════════════════════ */
const H=3600e3, D=24*H, FA='۰۱۲۳۴۵۶۷۸۹';
const fa=x=>String(x).replace(/\d/g,d=>FA[d]);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pad=n=>String(n).padStart(2,'0');
function rot(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))|0;return ((Math.abs(h)%7)-3)*0.4;}
function g2j(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334],dv=(a,b)=>~~(a/b);
  let jy=gy<=1600?0:979; gy-=gy<=1600?621:1600;
  const gy2=gm>2?gy+1:gy;
  let days=365*gy+dv(gy2+3,4)-dv(gy2+99,100)+dv(gy2+399,400)-80+gd+gdm[gm-1];
  jy+=33*dv(days,12053); days%=12053; jy+=4*dv(days,1461); days%=1461;
  if(days>365){jy+=dv(days-1,365);days=(days-1)%365;}
  const jm=days<186?1+dv(days,31):7+dv(days-186,30);
  const jd=1+(days<186?days%31:(days-186)%30);
  return [jy,jm,jd];
}
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WEEK=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const jParts=ts=>{const d=new Date(ts);return g2j(d.getFullYear(),d.getMonth()+1,d.getDate());};
const fmtJ=(ts,time)=>{const [y,m,d]=jParts(ts);const dt=new Date(ts);
  return `${fa(d)} ${JM[m-1]}${time?`، ساعت ${fa(pad(dt.getHours()))}:${fa(pad(dt.getMinutes()))}`:''}`;};
const isoDate=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const isoDT=ts=>{const d=new Date(ts);return `${isoDate(ts)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;};
function cdShort(ms){
  const neg=ms<0; ms=Math.abs(ms);
  const d=Math.floor(ms/D),h=Math.floor(ms%D/H),m=Math.floor(ms%H/6e4);
  const s=d>0?`${fa(d)} روز`:h>0?`${fa(h)} ساعت`:`${fa(m)} دقیقه`;
  return neg?`${s} تأخیر`:`${s} مانده`;
}

function slaOf(t){
  const slaMs=t.slaH*H;
  if(t.status==='done'){
    const p=((t.completedAt||t.start)-t.start)/slaMs;
    return {pct:p,color:p<=1?'#2E9E63':'#D14B4B',label:p<=1?'تکمیل در SLA':'خارج از SLA'};
  }
  const p=Math.max(0,Date.now()-t.start)/slaMs;
  if(p>=1)   return {pct:p,color:'#D14B4B',label:'نقض SLA'};
  if(p>=.75) return {pct:p,color:'#E8722A',label:'در خطر'};
  if(p>=.5)  return {pct:p,color:'#D9A004',label:'پایش'};
  if(p>0)    return {pct:p,color:'#2E9E63',label:'سالم'};
  return {pct:0,color:'#2E7DB8',label:'شروع نشده'};
}
const stats=()=>{
  const c={todo:0,inprogress:0,review:0,done:0};
  state.tasks.forEach(t=>c[t.status]++);
  return c;
};

/* ════════════════════ چارت‌های SVG دست‌ساز ════════════════════ */
function donutSVG(parts){
  const total=parts.reduce((s,p)=>s+p.value,0)||1, C=2*Math.PI*46;
  let acc=0;
  const segs=parts.map((p,i)=>{
    const len=p.value/total*C, off=-acc; acc+=len;
    return `<circle r="46" cx="60" cy="60" fill="none" stroke="${p.color}" stroke-width="13" class="donut-seg"
      data-arr="${Math.max(len-2.5,0).toFixed(2)} ${C}" stroke-dasharray="0 ${C}"
      stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 60 60)" style="transition-delay:${i*140}ms"/>`;
  }).join('');
  return `<svg viewBox="0 0 120 120" class="w-full h-full">${segs}</svg>`;
}
function areaSVG(series,target){
  const W=600,Ht=200,PX=10,PT=16,PB=30;
  const max=Math.max(...series,target||0)*1.18, n=series.length;
  const pts=series.map((v,i)=>({x:PX+i*(W-2*PX)/(n-1),y:PT+(1-v/max)*(Ht-PT-PB)}));
  let d=`M${pts[0].x},${pts[0].y}`;
  for(let i=0;i<n-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(n-1,i+2)];
    d+=`C${(p1.x+(p2.x-p0.x)/6).toFixed(1)},${(p1.y+(p2.y-p0.y)/6).toFixed(1)} ${(p2.x-(p3.x-p1.x)/6).toFixed(1)},${(p2.y-(p3.y-p1.y)/6).toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  const ty=PT+(1-target/max)*(Ht-PT-PB);
  const grid=[.25,.5,.75].map(g=>{const gy=PT+g*(Ht-PT-PB);
    return `<line x1="${PX}" y1="${gy}" x2="${W-PX}" y2="${gy}" stroke="#EFE6CF" stroke-dasharray="4 5" stroke-width="1"/>`;}).join('');
  const last=pts[n-1];
  return `<svg viewBox="0 0 ${W} ${Ht}" class="w-full">
    ${grid}
    <line x1="${PX}" y1="${ty}" x2="${W-PX}" y2="${ty}" stroke="#F2B705" stroke-width="2" stroke-dasharray="7 6" opacity=".85"/>
    <path d="${d} L${last.x},${Ht-PB} L${pts[0].x},${Ht-PB} Z" fill="#2E7DB8" class="area-fill" opacity="0" fill-opacity=".12"/>
    <path d="${d}" fill="none" stroke="#0F4C81" stroke-width="2.5" stroke-linecap="round" class="draw-line"/>
    <circle cx="${last.x}" cy="${last.y}" r="5" fill="#2E9E63" class="pulse-dot"/>
    <circle cx="${last.x}" cy="${last.y}" r="2.5" fill="#fff"/>
    <text x="${PX}" y="${Ht-8}" font-size="11" fill="#8CA0B3">۱۴ روز پیش</text>
    <text x="${W-PX}" y="${Ht-8}" font-size="11" fill="#8CA0B3" text-anchor="end">امروز</text>
  </svg>`;
}
function barsSVG(data){
  const max=Math.max(...data.map(d=>d.v),1);
  return `<div class="flex items-end gap-2 lg:gap-3 h-44">
    ${data.map((d,i)=>`
    <div class="flex-1 flex flex-col items-center gap-1.5 group h-full justify-end">
      <div class="text-[11px] font-black ${i===data.length-1?'text-sun-600':'text-sea-700'} opacity-0 group-hover:opacity-100 transition">${fa(d.v)}</div>
      <div class="w-full rounded-t-lg bar-grow ${i===data.length-1?'bg-sun-500 group-hover:bg-sun-600':'bg-sea-500/85 group-hover:bg-sea-600'}" data-h="${(d.v/max*100).toFixed(1)}" style="height:0%"></div>
      <div class="text-[10.5px] text-ink-500 font-bold">${d.l}</div>
    </div>`).join('')}
  </div>`;
}
function animateIn(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('[data-w]').forEach(el=>el.style.width=el.dataset.w+'%');
    document.querySelectorAll('.bar-grow').forEach((b,i)=>{b.style.transitionDelay=(i*70)+'ms';b.style.height=b.dataset.h+'%';});
    document.querySelectorAll('.donut-seg').forEach(c=>c.setAttribute('stroke-dasharray',c.dataset.arr));
    document.querySelectorAll('.draw-line').forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.getBoundingClientRect();p.style.strokeDashoffset='0';});
    document.querySelectorAll('.area-fill').forEach(a=>{a.style.opacity='1';a.setAttribute('fill-opacity','.12');});
  }));
}

function renderDashboard(){

  const risky=state.tasks.filter(t=>t.status!=='done'&&slaOf(t).pct>=.75).length;
  const segs=[
    {k:'done',v:c.done,col:STATUS.done.dot},{k:'review',v:c.review,col:STATUS.review.dot},
    {k:'inprogress',v:c.inprogress,col:STATUS.inprogress.dot},{k:'todo',v:c.todo,col:STATUS.todo.dot},
  ];

function renderSubChips(){

function addSubChip(){const i=document.getElementById('sub-in');const s=i.value.trim();if(s&&!draft.subs.includes(s))draft.subs.push(s);i.value='';renderSubChips();}
function removeSub(s){draft.subs=draft.subs.filter(x=>x!==s);renderSubChips();}
function toggleDep(id){const i=draft.deps.indexOf(id);i>-1?draft.deps.splice(i,1):draft.deps.push(id);
  const b=document.querySelector(`[data-dep="${id}"]`);
  b.classList.toggle('bg-sea-50');b.classList.toggle('border-sea-500');b.classList.toggle('text-sea-700');b.classList.toggle('bg-white');b.classList.toggle('border-cream-300');b.classList.toggle('text-ink-700');}
function setDraftPrio(p){draft.priority=p;document.querySelectorAll('#f-prio [data-p]').forEach(b=>{
  const on=b.dataset.p===p;b.style.background=on?PRIO[b.dataset.p].c:'';b.style.color=on?'#fff':'';b.classList.toggle('text-white',on);b.classList.toggle('text-ink-500',!on);b.classList.toggle('border-transparent',on);b.classList.toggle('shadow',on);});}
function renderImgPrev(){

    ?`<img src="${draft.img}" class="w-full h-full object-cover">`
    :`<div class="h-full grid place-items-center text-ink-400 gap-1.5"><i data-lucide="image" class="w-7 h-7"></i><span class="text-[11px] font-bold">تصویری انتخاب نشده</span></div>`;
  refreshIcons();
}
function pickImage(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{draft.img=e.target.result;renderImgPrev();toast('تصویر بارگذاری شد','info');};r.readAsDataURL(f);}

function clearImage(){draft.img=null;renderImgPrev();}
function saveTask(){
  const err=document.getElementById('f-err');
  const show=m=>{err.classList.remove('hidden');err.querySelector('span').textContent=m;};
  draft.title=v('f-title').trim(); draft.desc=v('f-desc').trim();
  draft.group=v('f-group'); draft.assignee=v('f-assignee');
  draft.estimate=+v('f-est')||4; draft.slaH=+v('f-sla')||24;
  draft.start=v('f-start')?new Date(v('f-start')+'T09:00').getTime():Date.now();
  draft.deadline=v('f-deadline')?new Date(v('f-deadline')).getTime():Date.now()+3*D;
  if(!draft.title)return show('عنوان تسک الزامی است');
  if(isNaN(draft.deadline))return show('ددلاین تحویل را مشخص کنید');
  if(draft.deadline<=draft.start)return show('ددلاین باید بعد از تاریخ شروع باشد');
  err.classList.add('hidden');
  if(draft.id){
    const t=byId(draft.id);Object.assign(t,draft,{subs:[...draft.subs],deps:[...draft.deps]});
    t.log.push({t:Date.now(),txt:'تسک توسط مدیر پروژه ویرایش شد'});
    toast('تغییرات تسک ذخیره شد','ok');
  }else{
    state.tasks.unshift({...draft,id:'t'+Date.now(),subs:[...draft.subs],deps:[...draft.deps],
      status:'todo',worked:0,completedAt:null,log:[{t:Date.now(),txt:'تسک ایجاد و وارد بوم پروژه شد'}]});
    toast('تسک جدید با موفقیت ایجاد شد','ok');
  }
  closeModal(); renderCurrent(); updateSidebarSprint();
}

      <span class="cico !w-11 !h-11 bg-berry-100 text-berry-600 flex-none"><i data-lucide="triangle-alert" class="w-5 h-5"></i></span>
      <div><div class="font-extrabold text-[14px] mb-1">حذف «${esc(t.title)}»</div>
      <p class="text-[12.5px] text-ink-500 font-bold leading-6">این تسک همراه با تمام زمان‌بندی، وابستگی‌ها و تاریخچه‌اش حذف خواهد شد و قابل بازگشت نیست.</p></div>
    </div>
  </div>
  <div class="px-6 py-4 border-t border-cream-200 bg-cream-100/60 flex gap-2 flex-none">
    <button onclick="deleteTask('${id}')" class="btn-danger"><i data-lucide="trash-2" class="w-4 h-4"></i>حذف قطعی</button>
    <button onclick="closeModal()" class="btn-ghost">انصراف</button>
  </div>`,'max-w-md');
}
function deleteTask(id){
  state.tasks=state.tasks.filter(t=>t.id!==id);
  state.tasks.forEach(t=>t.deps=t.deps.filter(d=>d!==id));
  closeModal(); toast('تسک حذف شد','bad'); renderCurrent(); updateSidebarSprint();
}

/* ---- مودال جزئیات (کاربر) ---- */
function openDetail(id){
  const t=byId(id); if(!t)return;
  const m=member(t.assignee), s=slaOf(t), cd=t.deadline-Date.now();
  const deps=t.deps.map(d=>byId(d)).filter(Boolean);
  const blocked=t.status!=='done'&&deps.some(d=>d.status!=='done');
  const stat=(ico,col,bg,label,val,sub='')=>`
    <div class="rounded-xl border border-cream-200 bg-white p-3">
      <div class="flex items-center gap-1.5 text-[10.5px] text-ink-500 font-bold mb-1"><i data-lucide="${ico}" class="w-3.5 h-3.5" style="color:${col}"></i>${label}</div>
      <div class="text-[13px] font-black text-ink-900">${val}</div>
      ${sub?`<div class="text-[10px] mt-1 text-ink-400 font-bold">${sub}</div>`:''}
    </div>`;
  openModal(`${mHead('جزئیات تسک')}
  <div class="p-5 lg:p-6 overflow-y-auto flex-1 space-y-4">
    ${t.image?`<img src="${t.image}" class="w-full h-44 object-cover rounded-xl border border-cream-200">`:''}
    <div>
      <div class="font-black text-lg text-ink-900 leading-7">${esc(t.title)}</div>
      <div class="flex flex-wrap gap-1.5 mt-2.5">${groupChip(t.group)}${subChips(t)}${prioChip(t.priority)}${pill(t.status)}</div>
    </div>
    ${blocked?`<div class="flex items-start gap-2.5 rounded-xl bg-sun-100 border border-sun-500/40 px-3.5 py-2.5 text-[12px] font-bold text-ink-900">
      <i data-lucide="triangle-alert" class="w-4 h-4 text-sun-600 mt-0.5 flex-none"></i>این تسک به موارد ناتمام وابسته است؛ پیش از شروع، وضعیت وابستگی‌ها را بررسی کنید.</div>`:''}
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5">
      ${stat('calendar-days','#0F4C81','#DEEBF6','ددلاین تحویل',fmtJ(t.deadline))}
      ${stat('timer',t.status==='done'?'#8CA0B3':dlColor(cd),'#F8F3E7','زمان باقی‌مانده',t.status==='done'?'تکمیل شد':cdShort(cd))}
      ${stat('user-round',m.color,'#F8F3E7','مسئول اجرا',m.name)}
      ${stat('clipboard-list','#218551','#DDF2E5','کارکرد ثبت‌شده',`${fa(t.worked)} از ${fa(t.estimate)} ساعت`,
        `<div class="h-1.5 rounded-full bg-cream-100 overflow-hidden mt-1"><div style="width:${Math.min(t.worked/t.estimate*100,100).toFixed(0)}%;height:100%;background:#2E9E63;border-radius:99px"></div></div>`)}
    </div>
    ${deps.length?`<div><div class="flabel">وابستگی‌ها</div><div class="flex flex-wrap gap-1.5">
      ${deps.map(d=>`<button onclick="openDetail('${d.id}')" class="chip gap-1.5 border border-cream-300 bg-white hover:border-sea-500 transition cursor-pointer py-1">
        <span class="w-2 h-2 rounded-full" style="background:${STATUS[d.status].dot}"></span>${esc(d.title)}</button>`).join('')}</div></div>`:''}
    <div class="rounded-xl border border-cream-200 bg-white p-3.5">
      <div class="flex justify-between text-[11px] font-bold mb-2"><span style="color:${s.color}">${s.label}</span>
        <span style="color:${s.color}">${fa(Math.round(Math.min(s.pct,1)*100))}٪ از سهمیه ${fa(t.slaH)} ساعته مصرف شده</span></div>
      <div class="h-2.5 rounded-full bg-cream-100 border border-cream-200 overflow-hidden">
        <div style="width:${Math.min(s.pct,1)*100}%;height:100%;background:${s.color};border-radius:99px"></div></div>
    </div>
    <div>
      <label class="flabel">توضیحات تسک (قابل ویرایش)</label>
      <textarea id="d-desc" rows="4" class="fld resize-none leading-6">${esc(t.desc)}</textarea>
      <button onclick="saveDesc('${id}')" class="btn-ghost mt-2 !py-1.5 !text-[12px]"><i data-lucide="check" class="w-3.5 h-3.5"></i>ذخیره توضیحات</button>
    </div>
    <div>
      <label class="flabel">تغییر وضعیت</label>
      <div class="flex gap-1.5">
        ${Object.entries(STATUS).map(([k,val])=>`<button onclick="setTaskStatus('${id}','${k}')"
          class="flex-1 rounded-xl border px-1 py-2 text-[11.5px] font-bold transition cursor-pointer
          ${t.status===k?'text-white shadow border-transparent':'text-ink-500 border-cream-300 bg-white hover:border-sea-500'}"
          ${t.status===k?`style="background:${val.dot}"`:''}>${val.label}</button>`).join('')}
      </div>
    </div>
    <div>
      <label class="flabel">ثبت کارکرد جدید</label>
      <div class="flex gap-2 max-w-xs">
        <input id="d-work" type="number" min="0.5" step="0.5" class="fld" placeholder="مثلاً ۲.۵ (ساعت)">
        <button onclick="logWork('${id}')" class="btn-primary flex-none"><i data-lucide="plus" class="w-4 h-4"></i>ثبت</button>
      </div>
    </div>
    <div class="rounded-xl bg-cream-100/70 border border-cream-200 p-3.5">
      <div class="text-[11px] font-black text-ink-700 mb-2 flex items-center gap-1.5"><i data-lucide="history" class="w-3.5 h-3.5"></i>تاریخچه رویدادها</div>
      <div class="space-y-1.5">${[...t.log].reverse().slice(0,5).map(l=>`
        <div class="flex items-center gap-2 text-[11px] font-bold text-ink-600">
          <span class="w-1.5 h-1.5 rounded-full bg-sea-500 flex-none"></span><span>${l.txt}</span>
          <span class="mr-auto text-ink-400">${fmtJ(l.t,true)}</span></div>`).join('')}</div>
    </div>
  </div>`,'max-w-3xl');
}
function saveDesc(id){
  const t=byId(id); const d=document.getElementById('d-desc').value.trim();
  if(!d)return toast('متن توضیحات نمی‌تواند خالی باشد','warn');
  t.desc=d; t.log.push({t:Date.now(),txt:'توضیحات تسک ویرایش شد'});
  toast('توضیحات ذخیره شد','ok'); openDetail(id); renderCurrentSilent();
}
function logWork(id){
  const t=byId(id); const h=parseFloat(document.getElementById('d-work').value);
  if(!h||h<=0)return toast('یک مقدار ساعت معتبر وارد کنید','warn');
  t.worked+=h; t.log.push({t:Date.now(),txt:`${fa(h)} ساعت کارکرد روی تسک ثبت شد`});
  toast(`${fa(h)} ساعت کارکرد ثبت شد`,'ok'); openDetail(id); renderCurrentSilent();
}
function setTaskStatus(id,st){moveTask(id,st);if(document.getElementById('d-desc'))openDetail(id);}
function moveTask(id,st){
  const t=byId(id); if(!t||t.status===st)return;
  t.status=st;
  if(st==='done')t.completedAt=Date.now(); else t.completedAt=null;
  t.log.push({t:Date.now(),txt:`وضعیت به «${STATUS[st].label}» تغییر یافت`});
  if(st==='done')toast(`تسک «${esc(t.title)}» تکمیل شد — ${slaOf(t).pct<=1?'در محدوده SLA':'خارج از SLA'}`,'ok');
  else toast(`وضعیت به «${STATUS[st].label}» تغییر یافت`,'info');
  renderCurrentSilent(); updateSidebarSprint();
}
function renderCurrentSilent(){
  if(state.view==='board'){renderBoardStatus();renderBoardCards();refreshIcons();}
  else if(state.view!=='dashboard')renderCurrent();
  else renderCurrent();
}

/* ════════════════════ اسپرینت سایدبار و راه‌اندازی ════════════════════ */
function updateSidebarSprint(){
  const c=stats(), total=state.tasks.length, pct=Math.round(c.done/total*100);
  const bar=document.getElementById('sb-bar');
  bar.dataset.w=pct;
  requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width=pct+'%'));
  document.getElementById('sb-lbl').textContent=`${fa(pct)}٪ ظرفیت اسپرینت مصرف شد`;
  document.getElementById('sb-days').textContent=`${fa(5)} روز مانده`;
}

renderNav(); renderNotifs(); setView('dashboard'); updateSidebarSprint();
tickClock(); setInterval(tickClock,1000);
renderNotifs();
setInterval(()=>{document.querySelectorAll('[data-cd]').forEach(el=>{el.textContent=cdShort(+el.dataset.cd-Date.now());});},20000);
</script>
</body>
</html>
